<!doctype html>
<html lang="es"><head><link rel="apple-touch-icon" sizes="180x180" href="./glorieta-icon-180.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="./glorieta-icon-192.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="icon" href="./favicon.svg?v=1" type="image/svg+xml"><link rel="shortcut icon" href="./favicon.svg?v=1"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#19242c"><meta name="description" content="Glorieta · Inventario colaborativo de PARQUE"><link rel="manifest" href="manifest.webmanifest"><title>GLORIETA | PARQUE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Kalam:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet"><style>
:root{font-family:Inter,"DM Sans",Arial,sans-serif;color:#eaf1ef;background:#0f1418;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0e1317}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #e6b650;outline-offset:2px}
.app-frame{max-width:1320px;margin:0 auto;min-height:100vh;padding:0;background:#11191f}
.blackboard{min-height:100vh;background:#151e25;border:0;box-shadow:none;overflow:visible}
.masthead{position:relative;display:flex;align-items:center;gap:16px;text-align:left;padding:18px 24px 17px;background:#19242c;border-bottom:1px solid #34444d}
.masthead .brand-logo{width:59px;height:59px;border-radius:13px;background:#f0f4f5;object-fit:contain;border:2px solid #40515a;padding:3px;box-shadow:0 2px 9px #0005}
.masthead .tiny-chalk{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-family:Inter,"DM Sans",Arial,sans-serif;color:#aabac2;font-weight:800}
.masthead h1{font-family:Inter,"DM Sans",Arial,sans-serif;font-weight:800;font-size:clamp(21px,4vw,29px);letter-spacing:.04em;line-height:1.2;margin:3px 0;color:#fff;text-shadow:none}
.masthead p{font-size:12px;color:#b8c4ca;margin:3px 0 0;font-family:Inter,"DM Sans",Arial,sans-serif}
.chalk-star,.corner-scribble,.amp{display:none}
.ribbon{display:none}
.workarea{padding:0 24px 35px;max-width:1110px;margin:auto}
.status-line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0 14px;border-bottom:1px solid #34434b;font-size:12px;color:#b9c9cf}
.status-line b{color:#8ee0b4}.section-heading{display:flex;align-items:center;padding:21px 0 10px}
.scribble{font:700 19px Inter,"DM Sans",Arial,sans-serif;color:#f5f7f8}
.chalk-underline{display:none}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:5px 0 20px}
.tile{display:flex;align-items:center;justify-content:center;gap:9px;min-height:58px;background:#23313a;color:#dce6ea;border:1px solid #40525c;border-radius:8px;box-shadow:none;padding:10px 12px;font-weight:750;font-size:13px;transform:none}
.tile:hover,.tile:focus-visible{background:#31444e}.tile.active{background:#ac7625;color:#fff;border-color:#d6a657}
.tile-icon{font:700 19px Arial,sans-serif;line-height:1}
#main-panel{min-height:340px}
.paper{position:relative;background:#1d2932;color:#f1f6f5;border:1px solid #384a54;border-radius:11px;box-shadow:0 8px 24px #0002;padding:23px;margin:4px 0 20px;transform:none;overflow:hidden}
.paper:before,.paper:after{display:none!important}
.paper h2{color:#fff;font:750 clamp(20px,4vw,25px) Inter,"DM Sans",Arial,sans-serif;margin:0 0 13px}
.paper h3{color:#fff;font:750 22px Inter,"DM Sans",Arial,sans-serif}
.paper p{color:#c1cdd3}.mini{font-size:12px;color:#9fadb5!important;line-height:1.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.badge-note{display:inline-block;background:#284239;border:1px solid #42735c;border-radius:30px;color:#b9f0d5;font-size:12px;padding:5px 10px}
.search-wrap{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
input,select,textarea{background:#111b22;color:#fff;border:1px solid #52636b;border-radius:7px;padding:12px 13px;max-width:100%}
input::placeholder,textarea::placeholder{color:#8697a0}
.search-wrap input{flex:1;min-width:190px}
.btn{appearance:none;border:1px solid #64737d;background:#30414c;color:#f4f8f9;border-radius:7px;padding:11px 14px;font-weight:700;box-shadow:none;text-decoration:none}
.btn:hover{filter:brightness(1.14)}.btn-green{background:#bc842d;color:#fff;border-color:#dda94a}
.btn-soft{background:#293842;color:#e4ecef;border-color:#475a63}.btn-red{background:#792d32;border-color:#a64d52;color:white}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:11px;margin-top:12px}
.product{display:flex;align-items:center;text-align:left;gap:12px;padding:14px;background:#25323b;color:#fff;border-radius:8px;border:1px solid #41535f;box-shadow:none;width:100%;transform:none;min-height:95px}
.product:hover{background:#2c3f4b}
.product .pic{width:62px;height:62px;flex-shrink:0;background:#121c23;border:1px solid #4a626c;border-radius:7px;display:grid;place-items:center;font-size:25px;overflow:hidden}
.pic img,.bigpic img,.preview img{width:100%;height:100%;object-fit:cover}
.product .info{display:flex;flex-direction:column;gap:4px;min-width:0}
.product .info b{font-size:15px;line-height:1.25;word-break:break-word}
.product .info small{font-size:11px;color:#b3c0c6}.qty{display:inline-block;color:#9fe3bb;font-size:16px;font-weight:800}
.qty.warning,.qty.danger{color:#f4c279}.empty{padding:35px 15px;text-align:center;color:#aebcc4;border:1px dashed #4c626e;border-radius:8px}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}
.form-field{display:flex;flex-direction:column;gap:7px;color:#d3dee1;font-weight:650;font-size:13px}
.form-field.full{grid-column:1/-1}
.form-field input,.form-field select,.form-field textarea{width:100%;display:block;margin-top:3px}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.preview{height:140px;max-width:240px;display:grid;place-items:center;background:#132029;border:1px dashed #61717d;border-radius:8px;overflow:hidden;color:#b7c6cb;cursor:pointer;text-align:center;padding:4px}
.detail-header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:16px 0}
.bigpic{height:130px;width:130px;border-radius:9px;background:#142028;border:1px solid #53646d;overflow:hidden;display:grid;place-items:center;font-size:44px}
.fields-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
.fields-list>div{background:#25333c;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px}
.fields-list small{color:#a8bac3}.fields-list b{font-weight:650;overflow-wrap:anywhere}
.stock-note{padding:16px;border-radius:9px;border:1px solid #415966;background:#182630;margin-top:20px}
.adjust{display:flex;gap:9px;flex-wrap:wrap}.adjust select,.adjust input{min-width:110px;flex:1}
.movement{padding:14px 0;border-bottom:1px solid #42525b;display:flex;justify-content:space-between;align-items:center;gap:12px}
.movement small{display:block;color:#adc0c8;font-size:11px;margin-top:6px}
footer{border-top:1px solid #334650;padding:24px 0;margin-top:24px;text-align:center;font-size:12px;color:#96aab3}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,150%);background:#e6eef0;color:#162127;border-radius:9px;padding:12px 17px;box-shadow:0 8px 32px #0008;z-index:10;max-width:90vw;transition:transform .2s}
#toast.show{transform:translate(-50%,0)}
@media(max-width:650px){
 .masthead{padding:15px 15px;gap:12px}.masthead .brand-logo{height:50px;width:50px}
 .workarea{padding:0 13px 30px}.section-heading{padding-top:19px}.scribble{font-size:17px}
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{min-height:52px}
 .paper{padding:16px;margin:4px 0 16px}.products{grid-template-columns:1fr}
 .field-grid{grid-template-columns:1fr;gap:12px}.form-field.full{grid-column:1}
 .fields-list{grid-template-columns:1fr 1fr}.status-line{font-size:11px}
 .search-wrap .btn{flex:1}.search-wrap input{min-width:100%}
}


/* Remitos — formularios de gestión profesional */
.remito-editor .remito-section{margin-top:22px;padding-top:20px;border-top:1px solid #43545c}
.remito-editor .remito-section h3{font-size:17px;margin:0 0 12px}
.remito-editor textarea{width:100%;resize:vertical;min-height:110px;margin:8px 0 0}
.remito-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:10px 0 0}
.remito-linea{display:grid;grid-template-columns:minmax(0,2fr) minmax(90px,.7fr) minmax(100px,.9fr) auto;gap:8px;align-items:end;background:#14222a;border:1px solid #415664;padding:11px;border-radius:8px;margin:11px 0}
.remito-linea label{display:flex;flex-direction:column;font-size:11px;color:#a8bec5;gap:6px;font-weight:700}
.remito-linea input,.remito-linea select{width:100%;min-width:0}
.remito-remove{min-height:45px}
.remitos-list{display:grid;gap:9px;margin-top:19px}
.remito-record{display:flex;justify-content:space-between;gap:15px;align-items:center;text-align:left;color:#e9f1f2;background:#273740;border:1px solid #435964;border-radius:8px;padding:14px 15px;font:600 14px Inter,"DM Sans",Arial,sans-serif}
.remito-record:hover{background:#31454f}
.remito-record b{font-size:16px}
.remito-record small{display:block;font-size:12px;color:#aec0c7;margin-top:7px}
.remito-tag{font-size:11px;white-space:nowrap;background:#31483e;color:#a9e3c4;border-radius:5px;padding:7px 9px}
.remito-photo{color:#d7b272;text-decoration:underline}
.remito-editor .form-field small{font-weight:400;color:#97aab3}
@media(max-width:700px){
 .remito-linea{grid-template-columns:1fr 1fr;gap:10px}
 .remito-linea label:first-child{grid-column:1/-1}
 .remito-linea .remito-remove{grid-column:1/-1}
 .remito-record{align-items:flex-start;flex-direction:column}
}
</style></head><body>
<div class="app-frame"><div class="blackboard">
<header class="masthead">
<img class="brand-logo" src="./glorieta-icon-192.png" alt="Logo GLORIETA">
<div><div class="tiny-chalk">PARQUE · GESTIÓN DE MATERIALES</div><h1>GLORIETA</h1><p>Administración de inventario · Acceso de encargados</p></div>
</header>
<div class="workarea"><div class="status-line"><span>🟢 <b>Inventario activo</b></span><span id="date-text"></span></div><div class="section-heading"><span class="scribble">Panel de administración</span></div>
<nav class="tiles" aria-label="Secciones"><button class="tile active" data-view="inventory"><span class="tile-icon">▤</span><span>Inventario</span></button><button class="tile" data-view="add"><span class="tile-icon">＋</span><span>Cargar artículo</span></button><button class="tile" data-view="moves"><span class="tile-icon">↔</span><span>Movimientos</span></button><button class="tile" data-view="remitos"><span class="tile-icon">▤</span><span>Remitos</span></button></nav>
<main id="main-panel" aria-live="polite"></main>
<footer>GLORIETA · Sistema interno de inventario · Solo personal autorizado</footer></div>
</div></div>
<div id="toast" role="status" aria-live="polite"></div><script src="cloud.js?v=11"></script><script src="remitos.js?v=1"></script></body></html>
