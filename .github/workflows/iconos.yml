name: Generar iconos GLORIETA
on:
  workflow_dispatch:
  push:
    paths:
      - 'favicon.svg'
      - '.github/workflows/iconos.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar render SVG
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Crear PNG para pantalla de inicio
        run: |
          python - <<'PY'
          import cairosvg
          for size in (180,192,512):
              cairosvg.svg2png(url='favicon.svg',write_to=f'glorieta-icon-{size}.png',output_width=size,output_height=size)
          PY
      - name: Publicar iconos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glorieta-icon-180.png glorieta-icon-192.png glorieta-icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: iconos PNG para instalar GLORIETA en celulares"
            git push
          fi
